<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>valera.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A;
    --bg-2:#111110;
    --white:#F4F2ED;
    --dim:#a8a49c;
    --gray:#6b6862;
    --accent:#4CAF7D;
    --line: rgba(244,242,237,0.12);
    --line-strong: rgba(244,242,237,0.22);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--accent);color:var(--bg);}

  /* ---------- PRELOADER ---------- */
  #preloader{
    position:fixed; inset:0; z-index:999;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #preloader.hide{opacity:0; visibility:hidden; pointer-events:none;}
  #preloader img{
    width:min(200px, 40vw);
    height:auto;
    display:block;
  }
  body.loading{overflow:hidden;}

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--gray);
  }
  h1,h2,h3{
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:600;
    letter-spacing:-0.02em;
    line-height:1.02;
  }
  a{color:inherit;}

  /* ---------- NAV ---------- */
  nav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 5vw;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  nav img{height:30px; display:block;}
  nav ul{list-style:none; display:flex; gap:30px;}
  nav a{
    color:var(--accent);
    font-size:13px;
    letter-spacing:0.01em;
    text-decoration:none;
    transition:color .2s ease;
  }
  nav a:hover{color:var(--white);}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    height:100svh;
    min-height:600px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    overflow:hidden;
  }
  .hero img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position:50% 20%;
    filter:grayscale(1) contrast(1.08) brightness(0.85);
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,10,10,0.1) 0%, rgba(10,10,10,0.25) 40%, rgba(10,10,10,0.97) 100%);
  }
  .hero-content{
    position:relative; z-index:2;
    padding:0 5vw 64px;
    max-width:100%;
  }
  .hero-logo{
    display:block;
    width:auto;
    height:auto;
    max-width:min(620px, 70vw);
    max-height:22vh;
    margin-bottom:22px;
  }
  .hero-tagline{
    font-family:'IBM Plex Mono', monospace;
    font-size:clamp(12px,1.3vw,14px);
    letter-spacing:0.04em;
    color:var(--dim);
    max-width:44ch;
    line-height:1.7;
  }
  .hero-tagline b{color:var(--accent); font-weight:500;}
  .scroll-hint{
    position:absolute; bottom:26px; right:5vw; z-index:2;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--dim);
    display:flex; align-items:center; gap:10px;
  }
  .scroll-hint .stroke{
    width:1px; height:34px; background:var(--dim);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scaleY(1); opacity:.4;}
    50%{transform:scaleY(0.5); opacity:1;}
  }
  @media (max-height:700px){
    .hero{min-height:420px;}
    .hero-content{padding-bottom:36px;}
    .hero-logo{max-height:16vh; margin-bottom:14px;}
  }

  /* ---------- SECTION SHARED ---------- */
  section{
    padding:130px 5vw;
    position:relative;
    border-top:1px solid var(--line);
  }
  .section-head{
    display:flex; align-items:baseline; gap:16px;
    margin-bottom:64px;
  }
  .section-head .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--gray);
  }
  .section-head h2{
    font-size:clamp(32px,4.6vw,58px);
    color:var(--accent);
  }

  /* ---------- RELEASES ---------- */
  .releases{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  .release-card{
    background:var(--bg);
    display:flex;
    flex-direction:column;
    text-decoration:none;
    transition:background .25s ease;
  }
  .release-card:hover{background:var(--bg-2);}
  .release-cover{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .release-cover img{
    width:100%; height:100%;
    display:block;
    object-fit:cover;
    filter:grayscale(0.85) contrast(1.08) brightness(0.92);
    transition:filter .4s ease, transform .5s ease;
  }
  .release-card:hover .release-cover img{
    filter:grayscale(0.1) contrast(1.08) brightness(0.98);
    transform:scale(1.03);
  }
  .release-info{
    padding:28px 28px 32px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .release-card .rel-type{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--gray);
  }
  .release-card .rel-title{
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:600;
    font-size:clamp(24px,2.6vw,34px);
    letter-spacing:-0.01em;
    color:var(--white);
  }
  .release-card .rel-year{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--gray);
  }
  .releases-cta{
    margin-top:44px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .btn-outline{
    display:inline-flex; align-items:center; gap:12px;
    border:1px solid var(--line-strong);
    color:var(--accent);
    text-decoration:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px; letter-spacing:0.08em; text-transform:uppercase;
    padding:16px 26px;
    transition:border-color .25s ease, color .25s ease;
  }
  .btn-outline:hover{border-color:var(--accent); color:var(--white);}
  .releases-note{
    margin-top:24px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.02em;
    color:var(--gray);
    max-width:56ch;
    line-height:1.7;
  }
  @media (max-width:860px){
    .releases{grid-template-columns:1fr;}
  }

  /* ---------- TOUR ---------- */
  .ticket{
    display:grid;
    grid-template-columns: 130px 1fr 140px;
    align-items:center;
    gap:24px;
    padding:26px 0;
    border-bottom:1px solid var(--line);
  }
  .ticket:first-of-type{border-top:1px solid var(--line);}
  .ticket .date{
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:600;
    font-size:clamp(22px,2.4vw,28px);
  }
  .ticket .date span{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:0.1em;
    color:var(--gray);
    margin-top:4px;
    font-weight:400;
  }
  .ticket .city{font-size:15px; color:var(--dim);}
  .ticket .city b{
    font-weight:600; color:var(--white);
    display:block; font-size:17px; margin-bottom:3px;
  }
  .ticket .status{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    text-align:right;
    color:var(--accent);
  }
  .tour-empty{
    padding:26px 0;
    border-top:1px solid var(--line);
    font-size:16px;
    color:var(--dim);
    max-width:56ch;
    line-height:1.7;
  }

  /* ---------- CONTACT / FOOTER ---------- */
  footer{padding:120px 5vw 40px;}
  .footer-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:40px;
    border-bottom:1px solid var(--line);
    padding-bottom:64px;
  }
  .footer-top h2{
    font-size:clamp(38px,6.5vw,80px);
    max-width:11ch;
  }
  .footer-top h2 span{color:var(--accent);}
  .socials{display:flex; flex-direction:column; gap:16px;}
  .socials a{
    text-decoration:none;
    font-size:14px; letter-spacing:0.01em;
    color:var(--white);
    display:flex; align-items:center; gap:10px;
    opacity:.85;
    transition:opacity .2s ease, gap .2s ease;
  }
  .socials a:hover{opacity:1; gap:16px;}
  .socials a .arrow{color:var(--accent); font-family:'IBM Plex Mono', monospace;}
  .socials a.disabled{opacity:.3; pointer-events:none;}

  .footer-bottom{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:16px;
    padding-top:28px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:0.06em;
    color:var(--gray);
  }
  .footer-bottom img{height:14px; opacity:.7;}

  /* ---------- reveal ---------- */
  .reveal{opacity:0; transform:translateY(22px); transition:opacity .7s ease, transform .7s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1; transform:none; transition:none;}
    .scroll-hint .stroke{animation:none;}
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:860px){
    .ticket{grid-template-columns:1fr; gap:6px;}
    .ticket .status{text-align:left;}
    .footer-top{flex-direction:column; align-items:flex-start;}
  }
  @media (max-width:520px){
    section{padding:80px 6vw;}
    nav{padding:14px 6vw;}
    nav img{height:22px;}
    nav ul{gap:14px;}
    nav a{font-size:10.5px;}
    .hero-content{padding:0 6vw 44px;}
    .hero-tagline{font-size:12px;}
    .section-head{margin-bottom:40px; gap:10px;}
    .section-head h2{font-size:clamp(26px,7vw,36px);}
    .release-info{padding:20px 18px 24px; gap:10px;}
    .release-card .rel-title{font-size:clamp(20px,5.5vw,26px);}
    .releases-cta{margin-top:32px;}
    .btn-outline{width:100%; justify-content:center; padding:15px 20px; font-size:11.5px;}
    footer{padding:80px 6vw 32px;}
    .footer-top{padding-bottom:40px; gap:28px;}
    .footer-top h2{font-size:clamp(30px,9vw,42px); max-width:9ch;}
    .socials a{font-size:13px;}
    .footer-bottom{font-size:9px;}
    .scroll-hint{display:none;}
  }
  @media (max-width:360px){
    nav ul{gap:10px;}
    nav a{font-size:9.5px;}
  }
</style>
</head>

</nav>
